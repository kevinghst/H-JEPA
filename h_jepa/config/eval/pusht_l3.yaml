# Push-T: 3-level hierarchical planning, shared by H-JEPA and HWM.
# Sample counts: best mean success rate under 100 TFLOPs/episode.
cache_dir: ${oc.env:STABLEWM_HOME}
wandb:
  enabled: false
  entity: null
  project: hjepa-eval
  run_name: null
world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  history_size: 1
  frame_skip: 1
dataset:
  stats: pusht_expert_train
  keys_to_cache:
  - action
  - proprio
  - state
  level1:
    frameskip: 1
    num_steps: 1
seed: 42
policy: null
dump_eval_trajs_path: null
load_eval_trajs_path: assets/eval_trajs/pusht/goal_offset_75_val.pt
solver:
  _target_: stable_worldmodel.solver.HierarchicalSolver
  solvers:
    level1:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 90
      batch_size: 1
      var_scale: 1.0
      num_samples: 25
      action_noise: 0
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.1
    level2:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 90
      batch_size: 1
      var_scale: 1.0
      num_samples: 50
      action_noise: 0.01
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.075
    level3:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 90
      batch_size: 1
      var_scale: 1.0
      num_samples: 200
      action_noise: 0.01
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.075
hierarchical_plan_config:
  resolve_horizon: true
  receding_horizon: 2
  level1:
    horizon: 2
    pre_decay_horizon: 2
    action_block: 5
    cost_last_n: 2
    action_cost_weight: 0.2
  level2:
    horizon: 2
    pre_decay_horizon: 2
    action_block: 1
    action_dim: 4
    cost_last_n: 1
  level3:
    horizon: 4
    action_block: 1
    action_dim: 4
    cost_last_n: 1
eval:
  num_eval: 50
  traj_sampling_mode: stratified
  goal_offset_steps: 75
  eval_budget: 90
  img_size: 224
  dataset_name: pusht_expert_train
  callables:
  - method: _set_state
    args:
      state:
        value: state
  - method: _set_goal_state
    args:
      goal_state:
        value: goal_state
output:
  dir: null
  filename: pusht_results.txt
