# DROID: flat level-1 planning, read by droid_plan_eval.py (offline, open-loop).
# One planning call per clip plans the whole 36-step goal window (5 fps) and is scored
# on the endpoint only.
seed: 1234
clips: droid_assets/droid_clips_waypoint_curated16v2_5fps_gw36.json
img_size: 256
eval_budget: 36
solver:
  _target_: stable_worldmodel.solver.GradientSolver
  n_steps: 90
  min_its: 30
  early_stop_patience: 5
  early_stop_rel_delta: 0.01
  batch_size: 1
  var_scale: 1.5
  num_samples: 32
  action_noise: 0
  action_clip_sigma: 2.0
  device: cuda
  seed: ${seed}
  optimizer_cls:
    _target_: hydra.utils.get_class
    path: torch.optim.AdamW
  optimizer_kwargs:
    lr: 0.01
    weight_decay: 0.01
plan_config:
  horizon: 36
  receding_horizon: 36
  cost_last_n: 1
