# Visual AntMaze: flat level-1 planning (LeWM).
# Sample counts: best mean success rate under 100 TFLOPs/episode.
cache_dir: ${oc.env:STABLEWM_HOME}
world:
  env_name: swm/OGBAntMaze-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  history_size: 1
  frame_skip: 1
  ob_type: pixels
  width: 64
  height: 64
  camera_name: back
  maze_type: medium
  dataset_type: stitch
  terminate_at_goal: true
dataset:
  stats: visual_antmaze_medium_stitch_val_2_5x
  keys_to_cache:
  - action
  - xy
  - qpos
  - qvel
  keys_to_merge:
    proprio:
    - key: qpos
      start: 2
    - qvel
  level1:
    frameskip: 1
    num_steps: 1
seed: 42
policy: null
dump_eval_trajs_path: null
load_eval_trajs_path: assets/eval_trajs/ant/expert_grid_d3_n50.pt
solver:
  _target_: stable_worldmodel.solver.GradientSolver
  model: ???
  n_steps: 90
  batch_size: 1
  var_scale: 1.0
  num_samples: 100
  action_noise: 0
  device: cuda
  seed: ${seed}
  optimizer_cls:
    _target_: hydra.utils.get_class
    path: torch.optim.AdamW
  optimizer_kwargs:
    lr: 0.3
plan_config:
  horizon: 23
  receding_horizon: 2
  action_block: 5
  cost_last_n: 2
eval:
  num_eval: 50
  goal_offset_steps: 25
  start_state_mode: xy_neutral
  goal_state_mode: xy_neutral
  eval_budget: 350
  img_size: 64
  dataset_name: visual_antmaze_medium_stitch_val_2_5x
  callables:
  - method: set_state
    args:
      qpos:
        value: qpos
      qvel:
        value: qvel
  - method: set_navigation_goal
    args:
      goal_xy:
        value: goal_xy
output:
  dir: null
