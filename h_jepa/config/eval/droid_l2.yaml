# DROID: 2-level hierarchical planning, read by droid_plan_eval.py (offline, open-loop).
# Level 2 plans 12 macro-steps (36 // stride 3) scored on the endpoint and passes all 12
# as subgoals; level 1 plans the 36-step goal window scoring every subgoal (weight 0.5 on
# the intermediate ones). Defaults are the H-JEPA cell; HWM: --lr 0.01 0.1
# --num-samples 16.
seed: 1234
clips: droid_assets/droid_clips_waypoint_curated16v2_5fps_gw36.json
img_size: 256
eval_budget: 36
solver:
  _target_: hierarchical_solver.HierarchicalSolver
  solvers:
    level1:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 90
      min_its: 30
      early_stop_patience: 5
      early_stop_rel_delta: 0.01
      batch_size: 1
      var_scale: 1.5
      num_samples: 4
      action_noise: 0
      action_clip_sigma: 2.0
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.03
        weight_decay: 0.01
    level2:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 90
      min_its: 30
      early_stop_patience: 5
      early_stop_rel_delta: 0.01
      batch_size: 1
      var_scale: 1.5
      num_samples: 4
      action_noise: 0
      action_clip_sigma: 2.0
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.01
        weight_decay: 0.01
hierarchical_plan_config:
  receding_horizon: 36
  level1:
    horizon: 36
    pre_decay_horizon: 36
    cost_last_n: 999
    intermediate_cost_weight: 0.5
  level2:
    horizon: 12
    action_dim: 8
    num_subgoals: 12
    cost_last_n: 1
