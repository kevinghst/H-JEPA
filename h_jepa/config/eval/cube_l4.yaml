# OGBench Cube: 4-level hierarchical planning, shared by H-JEPA and HWM.
# Levels 3+ have horizon 1, so their solves are skipped: 2-level planning of a deeper model.
# Sample counts: best mean success rate under 100 TFLOPs/episode.
cache_dir: ${oc.env:HJEPA_HOME}
wandb:
  enabled: false
  entity: null
  project: hjepa-eval
  run_name: null
world:
  env_name: swm/OGBCube-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  history_size: 1
  frame_skip: 1
  env_type: single
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true
dataset:
  stats: cube_single_expert_val
  keys_to_cache:
  - action
  level1:
    frameskip: 1
    num_steps: 1
seed: 42
policy: null
dump_eval_trajs_path: null
load_eval_trajs_path: assets/eval_trajs/ogbench/goal_offset_20_pickup_val.pt
solver:
  _target_: hierarchical_solver.HierarchicalSolver
  solvers:
    level1:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 90
      batch_size: 1
      var_scale: 1.0
      num_samples: 200
      action_noise: 0
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.1
    level2:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 90
      batch_size: 1
      var_scale: 1.0
      num_samples: 50
      action_noise: 0.01
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.075
    level3:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 90
      batch_size: 1
      var_scale: 1.0
      num_samples: 800
      action_noise: 0.01
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.075
    level4:
      _target_: stable_worldmodel.solver.GradientSolver
      n_steps: 90
      batch_size: 1
      var_scale: 1.0
      num_samples: 800
      action_noise: 0.01
      device: cuda
      seed: ${seed}
      optimizer_cls:
        _target_: hydra.utils.get_class
        path: torch.optim.AdamW
      optimizer_kwargs:
        lr: 0.075
hierarchical_plan_config:
  receding_horizon: 2
  level1:
    horizon: 2
    pre_decay_horizon: 2
    action_block: 5
    cost_last_n: 2
    action_cost_weight: 0.2
  level2:
    horizon: 2
    action_block: 1
    action_dim: 4
    cost_last_n: 1
  level3:
    horizon: 1
    action_block: 1
    action_dim: 4
    cost_last_n: 1
  level4:
    horizon: 1
    action_block: 1
    action_dim: 4
    cost_last_n: 1
eval:
  num_eval: 50
  goal_offset_steps: 20
  eval_budget: 30
  img_size: 224
  dataset_name: cube_single_expert_val
  callables:
  - method: set_state
    args:
      qpos:
        value: qpos
      qvel:
        value: qvel
  - method: set_target_pos
    args:
      cube_id:
        value: 0
        in_dataset: false
      target_pos:
        value: goal_privileged_block_0_pos
      target_quat:
        value: goal_privileged_block_0_quat
output:
  dir: null
