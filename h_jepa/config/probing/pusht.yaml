policy: null
env: pusht
description: post-hoc Push-T probing/decoding
output_subdir: final_probing_decoding_eval
seed: 42
device: auto
cache_dir: ${oc.env:STABLEWM_HOME}
epochs: 25
num_workers: 6
loader:
  batch_size: 128
  num_workers: 6
  drop_last: true
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true
  shuffle: true
optimizer:
  type: AdamW
  lr: 0.001
  weight_decay: 0.0001
  prober:
    lr: 0.001
    weight_decay: 0.0001
decoder:
  depth: 4
  dim: 256
  heads: 8
wandb:
  enabled: false
  config:
    entity: null
    project: hjepa-probing
    name: null
    id: null
    resume: allow
probe_targets: null
train_dataset:
  name: pusht_expert_train
  total_transitions: 250000
  keys_to_load:
  - pixels
  - action
  - state
  - proprio
  - block_ori
  - agent_xy
  - block_xy
  - agent_vel
  keys_to_cache:
  - action
  - state
  - proprio
  keys_to_merge:
    agent_xy:
      key: state
      start: 0
      end: 2
    block_xy:
      key: state
      start: 2
      end: 4
    agent_vel:
      key: state
      start: 5
      end: 7
  level1:
    frameskip: 1
    num_steps: 1
eval_datasets:
  val:
    name: pusht_expert_val
    keys_to_load:
    - pixels
    - action
    - state
    - proprio
    - block_ori
    - agent_xy
    - block_xy
    - agent_vel
    keys_to_cache:
    - action
    - state
    - proprio
    keys_to_merge:
      agent_xy:
        key: state
        start: 0
        end: 2
      block_xy:
        key: state
        start: 2
        end: 4
      agent_vel:
        key: state
        start: 5
        end: 7
    level1:
      frameskip: 1
      num_steps: 1
