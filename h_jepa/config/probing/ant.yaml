policy: null
env: ant
description: post-hoc Ant probing/decoding
output_subdir: final_probing_decoding_eval
seed: 42
device: auto
cache_dir: ${oc.env:STABLEWM_HOME}
epochs: 25
num_workers: 6
loader:
  batch_size: 128
  num_workers: 6
  drop_last: true
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true
  shuffle: true
optimizer:
  type: AdamW
  lr: 0.001
  weight_decay: 0.0001
  prober:
    lr: 0.001
    weight_decay: 0.0001
decoder:
  depth: 4
  dim: 256
  heads: 8
visualization:
  enabled: true
  every_n_epochs: 1
  num_frames: 32
  eval_dataset: first
  sampling: uniform
  seed: 42
wandb:
  enabled: false
  config:
    entity: null
    project: hjepa-probing
    name: null
    id: null
    resume: allow
probe_targets: null
train_dataset:
  name: visual_antmaze_medium_probing_train_2_5x
  total_transitions: 500000
  keys_to_load:
  - pixels
  - action
  - xy
  - qpos
  - qvel
  - proprio
  keys_to_cache:
  - action
  - xy
  - qpos
  - qvel
  keys_to_merge:
    proprio:
    - key: qpos
      start: 2
    - qvel
  level1:
    frameskip: 1
    num_steps: 1
  precompute_levels: false
eval_datasets:
  explore:
    name: visual_antmaze_medium_probing_eval_explore_2_5x
    total_transitions: 25000
    keys_to_load:
    - pixels
    - action
    - xy
    - qpos
    - qvel
    - proprio
    keys_to_cache:
    - action
    - xy
    - qpos
    - qvel
    keys_to_merge:
      proprio:
      - key: qpos
        start: 2
      - qvel
    level1:
      frameskip: 1
      num_steps: 1
    precompute_levels: false
  stitch:
    name: visual_antmaze_medium_probing_eval_stitch_2_5x
    total_transitions: 25000
    keys_to_load:
    - pixels
    - action
    - xy
    - qpos
    - qvel
    - proprio
    keys_to_cache:
    - action
    - xy
    - qpos
    - qvel
    keys_to_merge:
      proprio:
      - key: qpos
        start: 2
      - qvel
    level1:
      frameskip: 1
      num_steps: 1
    precompute_levels: false
