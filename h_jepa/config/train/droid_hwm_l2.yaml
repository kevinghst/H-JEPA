# DROID: 2-level HWM baseline trained end to end. Same as H-JEPA except level 2 has an
# identity encoder, no IDM and no SIGReg, and level 1 trains 1-step predictions only.
# pred weight (T-1)/T = the paper runs' 1-step loss, averaged over all T window states (context state included).
defaults:
- base/droid
- _self_
output_model_name: droid_hwm_l2
num_levels: 2
save_every_n_epochs: 10
grad_clip_per_level: true
data:
  dataset:
    level2:
      frameskip: ${level2.stride}
      window_size: ${level2.window_size}
      num_steps: ${eval:'${level2.wm.history_size} + ${level2.wm.rollout_n}'}
trainer:
  max_epochs: 100
level1:
  wm:
    history_size: 7
    rollout_n: 1
  loss:
    embed:
      pred:
        enabled: true
        weight: ${eval:'7 / 8'}
level2:
  lr: 5.0e-04
  stride: 3
  window_size: 1
  idm_coeff: 0
  action_sigreg_coeff: 0.02
  wm:
    history_size: 2
    rollout_n: 1
    embed_dim: 384
    use_proprio: false
  encoder:
    type: identity
    input_dim: 384
    projector:
      type: identity
  action_encoder:
    type: mlp
    input_dim: ${level1.predictor.action_dim}
    hidden_dims:
    - 64
    output_dim: 8
    final_ln: true
    trunc_normal_init: true
    queue_size: 4000
  action_embed:
    type: identity
  predictor:
    type: causal_transformer
    action_dim: ${level2.action_encoder.output_dim}
    predictor_dim: 384
    depth: 12
    heads: 6
    dim_head: 64
    mlp_ratio: 4.0
    max_seq_len: 16
    dropout: 0.1
    emb_dropout: 0.0
    adaln_init_scale: 0.02
  loss:
    embed:
      pred:
        enabled: true
        weight: ${eval:'2 / 3'}
      sigreg:
        enabled: false
  probes:
    inputs:
      proprio: null
