# DROID: flat CLS model, v2 recipe: 6-frame clips (5 teacher-forced 1-step targets),
# gradient through the prediction target, 150 epochs.
# pred weight (T-1)/T = the paper runs' 1-step loss, averaged over all T window states (context state included).
defaults:
- base/droid
- _self_
output_model_name: droid_lewm_v2
num_levels: 1
save_every_n_epochs: 10
trainer:
  max_epochs: 150
level1:
  wm:
    history_size: 5
    rollout_n: 1
  loss:
    embed:
      pred:
        enabled: true
        weight: ${eval:'5 / 6'}
