# Cluster settings for launch.py. Copy the keys you change into config/slurm/local.yaml (gitignored),
# which overrides this file; --partition/--account/--qos/--time override both.
# Every null key must be set in local.yaml (or on the CLI); partition and account are set together.
venv: null            # python env activated by the job, e.g. /path/to/.venv (set it in local.yaml)
partition: null      # e.g. gpu
account: null
qos: null            # e.g. normal
gpus_per_node: 1      # train: srun one task per GPU, trainer.devices = gpus_per_node
cpus_per_task: 16
mem: 120G
time: "47:59:59"
train: {}             # per-subcommand overrides of the keys above
resume: {}
eval:
  gpus_per_node: 1
  cpus_per_task: 10
  mem: 64G
  base_minutes: 10    # eval --time = base_minutes + minutes_per_epoch[env] x epochs in the job
  minutes_per_epoch: {cube: 30, ant: 240, default: 60}
