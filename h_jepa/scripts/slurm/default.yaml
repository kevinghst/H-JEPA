# Cluster settings for launch.py. Copy the keys you change into local.yaml next to this file (gitignored),
# which overrides this file; --partition/--account/--qos/--time override both.
# Every null key must be set in local.yaml (or on the CLI); partition and account are set together.
venv: null            # python env whose bin/python runs the jobs, e.g. /path/to/.venv (set it in local.yaml)
partition: null      # e.g. gpu
account: null
qos: null            # e.g. normal
gpus_per_node: 1      # train: srun one task per GPU, trainer.devices = gpus_per_node
cpus_per_task: 16
mem: 120G
time: "47:59:59"      # train and resume jobs; eval jobs take eval.time_by_env
train: {}             # per-subcommand overrides of the keys above
resume: {}
eval:
  gpus_per_node: 1
  cpus_per_task: 10
  mem: 64G
  time_by_env: {cube: "00:40:00", ant: "04:10:00", default: "01:10:00"}  # one epoch per eval job
