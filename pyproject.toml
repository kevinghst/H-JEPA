[project]
name = "h-jepa"
version = "0.0.5"
description = "Hierarchical JEPA world models"
readme="README.md"
license="MIT"
authors = [
  {name = "Wancong Zhang"},
  {name = "Basile Terver"},
  {name = "Mike Rabbat"},
  {name = "Yann LeCun"},
  {name = "Randall Balestriero"},
]
urls = {Homepage = "https://github.com/kevinghst/H-JEPA"}
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "loguru",
  "tabulate",
  "gymnasium",
  "einops",
  "h5py",
  "scipy",
  "hdf5plugin",
  "tqdm",
  "gdown",
  "typer",
  "rich",
]

[project.optional-dependencies]
train = [
    "transformers>=4.50.0",
    "stable-pretraining==0.1.7",  # training only; main_hjepa.ResumableManager needs 0.1.7
    "lightning>=2.5",
    "torchmetrics",
    "hydra-core",
    "hydra-submitit-launcher",
    "wandb",
    "decord",
]

env = [
    "pygame",
    "pymunk",
    "shapely",
    "ogbench",
    "minigrid",
    "gymnasium[all]",
    "opencv-python",
    "stable_baselines3",
]

[dependency-groups]
dev = [
  "ipdb",
  "pytest",
  "pytest-cov>=7.0.0",
  "ruff",
  "twine",
  "mkdocs-shadcn",
  "pymdown-extensions",
  "pillow",
  "decord",
  "imageio[ffmpeg]",
  "mkdocstrings[python]",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "stable_worldmodel"
source-exclude = [
    "**/.mypy_cache/**",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.coverage.run]
omit = ["stable_worldmodel/envs/*"]